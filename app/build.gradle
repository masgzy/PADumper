plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose.compiler)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.lsplugin.jgit)
}

var repo = jgit.repo(true)
var commitCount = (repo?.commitCount("refs/remotes/origin/main") ?: 1)

android {
    compileSdk 35
    namespace "com.dumper.android"

    defaultConfig {
        applicationId  "com.dumper.android"
        minSdk 21
        targetSdk 35
        versionCode commitCount
        versionName "1.1.0"
    }

    signingConfigs {
        // NOTE: keystore.jks is intentionally committed to this public repo so
        // anyone can produce reproducible, signed APKs. It is a shared public
        // signature, not a secret.
        debug {
            storeFile file("keystore.jks")
            keyAlias "PADumper"
            storePassword "012345"
            keyPassword "012345"
        }
        release {
            storeFile file("keystore.jks")
            keyAlias "PADumper"
            storePassword "012345"
            keyPassword "012345"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        aidl true
        buildConfig true
        compose true
    }

    lint {
        // lifecycle-livedata 2.9.x ships the NullSafeMutableLiveData detector,
        // which crashes under Kotlin 2.2 UAST analysis with
        // IncompatibleClassChangeError (KaCallableMemberCall) during
        // lintVitalRelease. Nothing else regressed - disable just that check.
        disable "NullSafeMutableLiveData"
    }
}

kotlin {
    compilerOptions {
        // Replaces the deprecated android.kotlinOptions DSL (Kotlin 2.2+)
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    //Ui
    def composeBom = platform(libs.compose.bom)
    implementation composeBom
    androidTestImplementation composeBom

    implementation libs.androidx.appcompat
    implementation libs.compose.material3
    implementation libs.google.material
    implementation libs.compose.material.icons.extended

    // Android Studio Preview support
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    // Integration with activities
    implementation libs.androidx.activity.compose
    // Integration with ViewModels
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.compose.runtime.livedata
    // Integration with Navigation
    implementation libs.androidx.navigation.compose

    //Root
    implementation libs.libsu.core
    implementation libs.libsu.service

    //Storage Helper
    implementation libs.anggrayudi.storage

    //Unit tests
    testImplementation libs.junit
}
